apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-inventario
  labels:
    app: servicio-inventario
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servicio-inventario
  template:
    metadata:
      labels:
        app: servicio-inventario
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - servicio-inventario
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: inventario
          image: servicio-inventario:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-inventario
spec:
  selector:
    app: servicio-inventario
  ports:
    - port: 8002
      targetPort: 8002
